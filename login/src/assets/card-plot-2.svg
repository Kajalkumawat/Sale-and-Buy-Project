<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="p2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1b8"/>
      <stop offset="1" stop-color="#fff3e0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#p2sky)"/>
  <circle cx="60" cy="55" r="24" fill="#ffb15c" opacity="0.85"/>
  <rect y="110" width="400" height="150" fill="#b9d99a"/>

  <!-- boundary wall -->
  <rect x="20" y="118" width="360" height="10" fill="#c9a877"/>
  <g fill="#b08e5f">
    <rect x="20" y="118" width="14" height="10"/>
    <rect x="50" y="118" width="14" height="10"/>
    <rect x="80" y="118" width="14" height="10"/>
    <rect x="110" y="118" width="14" height="10"/>
    <rect x="140" y="118" width="14" height="10"/>
    <rect x="170" y="118" width="14" height="10"/>
    <rect x="200" y="118" width="14" height="10"/>
    <rect x="230" y="118" width="14" height="10"/>
    <rect x="260" y="118" width="14" height="10"/>
    <rect x="290" y="118" width="14" height="10"/>
    <rect x="320" y="118" width="14" height="10"/>
    <rect x="350" y="118" width="14" height="10"/>
  </g>

  <!-- survey stakes with flags -->
  <g>
    <line x1="90" y1="128" x2="90" y2="165" stroke="#8a5a34" stroke-width="4"/>
    <polygon points="90,132 112,140 90,148" fill="#ef4444"/>
  </g>
  <g>
    <line x1="230" y1="128" x2="230" y2="165" stroke="#8a5a34" stroke-width="4"/>
    <polygon points="230,132 252,140 230,148" fill="#3146ff"/>
  </g>
  <g>
    <line x1="320" y1="128" x2="320" y2="165" stroke="#8a5a34" stroke-width="4"/>
    <polygon points="320,132 342,140 320,148" fill="#ef4444"/>
  </g>

  <!-- plot outline highlight -->
  <rect x="150" y="145" width="120" height="95" fill="#ffd23f" opacity="0.25" stroke="#c98a06" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- small tree -->
  <rect x="40" y="180" width="8" height="40" fill="#8a5a34"/>
  <circle cx="44" cy="172" r="26" fill="#7fb069"/>
</svg>
